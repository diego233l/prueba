# Sitio nginx de "Mantenimiento coches". Se enlaza (symlink) desde /etc/nginx/sites-enabled/, así que un
# `git pull` también actualiza este archivo (se aplica con `sudo nginx -t && sudo systemctl reload nginx`).
# Rutas fijas: código en /opt/apps/mantenimiento-coches, datos en /var/lib/mantenimiento-coches.
server {
    listen 8080;
    server_name _;          # cambia por tu dominio/IP si quieres; el puerto 8080 evita chocar con otros sitios

    root /opt/apps/mantenimiento-coches/app/static;
    index index.html;
    client_max_body_size 4m;

    # Contraseña (fichero creado en la configuración inicial). Comenta estas dos líneas para dejarlo abierto.
    auth_basic "Mantenimiento coches";
    auth_basic_user_file /etc/nginx/mantenimiento-coches.htpasswd;

    # Interfaz: archivos estáticos servidos directamente por nginx.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    }

    # API: script Python por CGI (fcgiwrap). El código se lee del repositorio en cada petición.
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /opt/apps/mantenimiento-coches/app/api.cgi;
        fastcgi_param MC_DATA_DIR /var/lib/mantenimiento-coches;
        fastcgi_pass unix:/run/fcgiwrap.socket;
        fastcgi_read_timeout 60s;
    }

    # Nada de ocultos ni del código/datos (el root ya solo contiene la interfaz).
    location ~ /\. { deny all; }
}
